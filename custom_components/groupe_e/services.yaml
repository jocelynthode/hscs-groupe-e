reset_statistics:
  name: Reset statistics
  description: Delete all Groupe-E external statistics for a config entry and re-fetch from the API.
  fields:
    entry_id:
      name: Config entry
      description: The Groupe-E config entry whose statistics should be deleted.
      required: true
      selector:
        config_entry:
          integration: groupe_e
    rebuild_since:
      name: Rebuild since
      description: Only rebuild statistics from this date onward (ISO format, e.g. 2026-01-01). Preserves data before this date. Defaults to start of current year.
      required: false
      selector:
        text:
          type: date
    clear_all:
      name: Clear all
      description: If true, delete ALL statistics and rebuild from the start of the current year. Overrides rebuild_since. Defaults to false.
      required: false
      selector:
        boolean:
